<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogramm</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./img/favicon.png" type="image/x-icon">
</head>

<body>

    <header class="header">
        <headmenu class="headmenu">
            <mainlogo>
                <a href="./index.html">
                    <img class="mainlogo hide_mainlogo" src="./img/Fotogram_Logo.svg" alt="Bild:Farbkleckse">
                    <img class="mainlogo_mobile" src="./img/favicon.png" alt="Bild:Farbkleckse">
                </a>
            </mainlogo>

        </headmenu>


    </header>
    <main class="main">
        <headline class="headline headline_mobile">
            <h1 class="headline_txt">Herzlich Wilkommen in meinem Fotoalbum!</h1>
        </headline>

        <section class="img_area img_area_mobile">
            <button onclick="openDialog()" class="button_look" data-index="0"><img aria-label="Mountain with snow in water" src="./img/iceberg-8008071_1280.jpg"></button>

            <button onclick="openDialog()" class="button_look" data-index="1"><img aria-label="white iceberg in the water" src="./img/iceberg-8162195_1280.jpg"></button>

            <button onclick="openDialog()" class="button_look" data-index="2"><img aria-label="canoeist in front of large mountain with snow" src="./img/antarctic-3474502_1280.jpg"></button>

            <button onclick="openDialog()" class="button_look" data-index="3"><img aria-label="mountains with snow by the water" src="./img/antarctic-7719963_1280.jpg"></button>

            <button onclick="openDialog()" class="button_look" data-index="4"><img aria-label="mountains with snow by the water" src="./img/antarctic-7719964_1280.jpg"></button>

            <button onclick="openDialog()" class="button_look" data-index="5"><img aria-label="small broken ice floes in the water" src="./img/ice-7761319_1280.jpg"></button>

            <button onclick="openDialog()" class="button_look" data-index="6"><img aria-label="ice desert with blue sky" src="./img/ice-7788590_1280.jpg"></button>

            <button onclick="openDialog()" class="button_look" data-index="7"><img aria-label="iceberg emerging from the water and getting bigger towards the top" src="./img/iceberg-404966_1280.jpg"></button>

            <button onclick="openDialog()" class="button_look" data-index="8"><img aria-label="iceberg in water with rounded edges" src="./img/iceberg-8369810_1280.jpg"></button>

            <button onclick="openDialog()" class="button_look" data-index="9"><img aria-label="snow-capped mountains by the water" src="./img/ocean-7981878_1280.jpg"></button>

            <button onclick="openDialog()" class="button_look" data-index="10"><img aria-label="iceberg in the water in front of a large mountain" src="./img/navigation-2608122_1280.jpg"></button>

            <button onclick="openDialog()" class="button_look" data-index="11"><img aria-label="mountain landscape with snow and water" src="./img/antarctic-7719971_1280.jpg"></button>

        </section>

        <dialog id="img_one" class="dialog_size">
            <header>
                <h2>
                    Fotoanzeige
                </h2>
            </header>
            <section>
                <img class="galleryImage galleryImage_mobile galleryImage_mobile_small" id="galleryImage" src="" alt="Galerie-Bild" width="750">
                <br>
                
                
            </section>

            <footer class="footer_dialog">
                <button id="prevBtn" class="btn_size btn_size_mobile">◀ Zurück</button>
                <button onclick="closeDialog()" class="btn_size btn_size_mobile">X</button>
                <button id="nextBtn" class="btn_size btn_size_mobile">Weiter ▶</button>
            </footer>
        </dialog>
    </main>
    <footer class="footer">
        <a href="impressum.html">Impressum</a>
    </footer>


    <script src="./script.js"></script>
</body>

</html>
